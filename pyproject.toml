[project]
name = "model-discovery"
version = "0.1.0"
description = "Phase one: a chat agent that answers which AI model fits a need, from a curated, sourced database."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalog*", "mcp_server*", "agent*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a real PostgreSQL (started automatically, or TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S108", "S603", "S607"]
